# medNAMA NAS stack — IMAGE-BASED (NO build step).
# The prebuilt F1-F6 images are loaded with `docker load` from the .tar files,
# tagged app-backend:latest / app-frontend:latest, and this file only *uses* them.
# Run:  docker compose --env-file ./.env -f docker-compose.yml up -d

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: mednama-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
      POSTGRES_DB: ${POSTGRES_DB:-medrag}
    volumes:
      - /DATA/mednama/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medrag} -d ${POSTGRES_DB:-medrag}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [mednama]

  backend:
    image: app-backend:latest
    container_name: mednama-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medrag}:${POSTGRES_PASSWORD:-change-this-db-password}@db:5432/${POSTGRES_DB:-medrag}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-500}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # Optional tuning (see MANIFEST.txt). An empty RERANKER_SECOND_STAGE turns
      # the MedCPT second-stage reranker off (faster on a weak CPU).
      RERANKER_SECOND_STAGE: ${RERANKER_SECOND_STAGE-ncbi/MedCPT-Cross-Encoder}
      QUERY_REWRITE: ${QUERY_REWRITE:-true}
      LLM_THINKING: ${LLM_THINKING:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PAST_PAPERS_ACCESS: ${PAST_PAPERS_ACCESS:-all}
      PAGE_VIEWER_ACCESS: ${PAGE_VIEWER_ACCESS:-admin}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-}
      LLM_CHAT_BASE_URL: ${LLM_CHAT_BASE_URL:-}
      LLM_CHAT_API_KEY: ${LLM_CHAT_API_KEY:-}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-}
      LLM_FAST_BASE_URL: ${LLM_FAST_BASE_URL:-}
      LLM_FAST_API_KEY: ${LLM_FAST_API_KEY:-}
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /DATA/mednama/huggingface:/models/huggingface
      - /DATA/mednama/tmp:/tmp
      - /DATA/mednama/mcqs:/app/mcqs
      - /DATA/mednama/pdfs:/app/pdfs:ro
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks: [mednama]

  frontend:
    image: app-frontend:latest
    container_name: mednama-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${MEDNAMA_PORT:-3000}:3000"
    networks: [mednama]

networks:
  mednama:
    driver: bridge
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seed Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&display=swap" rel="stylesheet">
<style>
:root {
  /* the sheet (content) */
  --bg: #ffffff; --panel: #ffffff; --panel-2: #f6f6f5; --line: #ececea; --line-2: #dededb;
  --ink: #18181a; --ink-2: #57575c; --ink-3: #8b8b90;
  --accent: #0a84c6; --accent-soft: #e6f3fa; --ok: #1f7a4d; --ok-soft: #e5f3eb; --warn: #a86400; --warn-soft: #fbf0dc;
  --bad: #c43a2f; --bad-soft: #fbebe9; --run: #6a4bd1; --run-soft: #efeafd;
  --chip: #f2f2f0;
  /* the frame around it (sidebar + window edge): medNAMA charcoal */
  --frame: #232325; --frame-2: #2c2c2f; --frame-line: #36363a; --frame-ink: #e4e4e6; --frame-ink-2: #a3a3a8; --frame-ink-3: #77777d;
  --mono: "JetBrains Mono", ui-monospace, monospace; --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Fraunces", Georgia, serif;
  --r: 12px; --shadow: none;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1b1d; --panel: #1b1b1d; --panel-2: #232326; --line: #2c2c30; --line-2: #3a3a3f;
  --ink: #ececee; --ink-2: #a9a9ae; --ink-3: #7d7d83; --chip: #26262a;
  --accent: #4fb6ec; --accent-soft: #15293a; --ok: #4cc287; --ok-soft: #13281e; --warn: #eda64a; --warn-soft: #2c2213;
  --bad: #ff7a6e; --bad-soft: #301816; --run: #a691ff; --run-soft: #231d3b;
  --frame: #0f0f10; --frame-2: #19191b; --frame-line: #26262a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1b1b1d; --panel: #1b1b1d; --panel-2: #232326; --line: #2c2c30; --line-2: #3a3a3f;
  --ink: #ececee; --ink-2: #a9a9ae; --ink-3: #7d7d83; --chip: #26262a;
  --accent: #4fb6ec; --accent-soft: #15293a; --ok: #4cc287; --ok-soft: #13281e; --warn: #eda64a; --warn-soft: #2c2213;
  --bad: #ff7a6e; --bad-soft: #301816; --run: #a691ff; --run-soft: #231d3b;
  --frame: #0f0f10; --frame-2: #19191b; --frame-line: #26262a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--frame); color: var(--ink); font: 13.5px/1.5 var(--sans); font-feature-settings: "tnum" 1, "cv11" 1; -webkit-font-smoothing: antialiased; }
::selection { background: var(--accent-soft); color: var(--ink); }
a { color: var(--accent); text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 6px; }
.mono, .num { font-family: var(--mono); font-size: 12px; }
.num { text-align: right; white-space: nowrap; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
.chip { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; background: var(--chip); color: var(--ink-3); font-size: 12px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

/* shell: a charcoal frame (the sidebar) holding one white sheet */
.shell { display: grid; grid-template-columns: 244px 1fr; height: 100vh; padding: 8px 8px 8px 0; transition: grid-template-columns .3s cubic-bezier(.16,1,.3,1); }
.shell.collapsed { grid-template-columns: 0 1fr; padding-left: 8px; }
.shell.collapsed .side { visibility: hidden; }
.side { color: var(--frame-ink); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.side-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 10px 20px; }
.wordmark { font-family: var(--serif); font-size: 21px; letter-spacing: -.01em; color: #fff; line-height: 1; text-decoration: none; }
.wordmark i { color: #5cc4f2; font-style: italic; }
.wordmark small { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--frame-ink-3); margin-top: 6px; }
.iconbtn-dark { width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 7px; background: transparent; color: var(--frame-ink-2); cursor: pointer; }
.iconbtn-dark:hover { background: var(--frame-2); color: var(--frame-ink); }
.side-scroll { overflow: auto; flex: 1; padding: 4px 12px 10px; }
.glabel { font-family: var(--mono); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--frame-ink-3); padding: 14px 8px 6px; }
.sitem { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 8px; border-radius: 8px; color: var(--frame-ink); text-decoration: none; font-size: 13px; border: 0; background: transparent; cursor: pointer; text-align: left; }
.sitem:hover { background: var(--frame-2); }
.sitem.on { background: #ffffff14; }
.sitem svg { width: 15px; height: 15px; flex: none; color: var(--frame-ink-2); }
.sitem .end { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--frame-ink-3); font-size: 11.5px; }
.sitem .chev { transition: transform .2s ease; }
.sitem[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.sitem .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { display: flex; flex-direction: column; }
.sub .sitem { padding-left: 32px; color: var(--frame-ink-2); }
.sub .sitem.on, .sub .sitem:hover { color: var(--frame-ink); }
.sdivider { height: 1px; background: var(--frame-line); margin: 10px 4px 0; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #7d7d83; flex: none; }
.dot.run { background: #a691ff; box-shadow: 0 0 0 3px #a691ff2e; animation: breathe 1.8s ease-in-out infinite; }
.dot.warn { background: #eda64a; }
@keyframes breathe { 50% { box-shadow: 0 0 0 5px #a691ff10; } }
@media (prefers-reduced-motion: reduce) { .dot.run { animation: none; } .shell { transition: none; } }
.side-foot { border-top: 1px solid var(--frame-line); padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 1px; }
.side-user { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 0; font-size: 12px; color: var(--frame-ink-3); }
.side-user button { border: 0; background: none; color: var(--frame-ink-2); cursor: pointer; font-size: 12px; padding: 2px 4px; border-radius: 5px; }
.side-user button:hover { color: #fff; }
.badge { min-width: 18px; padding: 0 6px; border-radius: 999px; background: #a691ff; color: #141414; font-size: 10.5px; font-weight: 700; text-align: center; font-family: var(--mono); }

.main { background: var(--bg); border-radius: 14px; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex: none; }
.rbtn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--panel); display: grid; place-items: center; cursor: pointer; color: var(--ink-2); flex: none; }
.rbtn:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-3); }
.rbtn:disabled { opacity: .4; cursor: default; }
.rbtn svg { width: 14px; height: 14px; }
.tsep { width: 1px; height: 18px; background: var(--line-2); margin: 0 4px; }
.path { flex: 1; min-width: 0; color: var(--ink-3); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
.path b { color: var(--ink-2); font-weight: 500; }
.menu-btn { display: none; }
.main-scroll { overflow: auto; flex: 1; }
.page { padding: 34px 40px 80px; max-width: 1180px; margin: 0 auto; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; letter-spacing: -.015em; font-weight: 600; }
h2 { font-size: 14.5px; margin: 0 0 10px; font-weight: 600; letter-spacing: -.005em; }
.sub { color: var(--ink-3); margin: 4px 0 0; max-width: 760px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.panel-pad { padding: 16px 18px; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }

/* the overview's search: what do you want to seed? */
.hero { text-align: center; padding: 30px 0 34px; }
.hero h1 { font-size: 21px; }
.hero p { color: var(--ink-3); margin: 6px 0 18px; }
.omni { position: relative; max-width: 580px; margin: 0 auto; text-align: left; }
.omni-box { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line-2); border-radius: 999px; padding: 10px 16px; background: var(--panel);
  box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.14); transition: border-color .15s ease, box-shadow .15s ease; }
.omni-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.omni-box svg { width: 15px; height: 15px; color: var(--ink-3); flex: none; }
.omni-box input { border: 0 !important; outline: 0; background: transparent !important; flex: 1; padding: 0 !important; font-size: 14px; min-width: 0; }
.omni-results { margin-top: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); overflow: hidden; box-shadow: 0 14px 34px -18px rgba(0,0,0,.3); }
.omni-results .lrow { padding: 10px 14px; }
.omni-results .lrow:last-child { border-bottom: 0; }
.omni-results { max-height: 420px; overflow: auto; }
.omni-txt { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; flex: 1; }
.omni-txt .t { max-width: 100%; }
.omni-txt .chip { font-size: 11.5px; padding: 1px 8px; }

/* lists, in the reference's manner: hairline rows, a title, a grey chip, quiet actions */
.lgroup { margin-bottom: 30px; }
.lgroup-head { display: flex; align-items: baseline; gap: 10px; padding: 0 2px 10px; border-bottom: 1px solid var(--line); }
.lgroup-head h3 { margin: 0; font-size: 14.5px; font-weight: 600; }
.lgroup-head h3 span { color: var(--ink-3); font-weight: 400; }
.lrow { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); min-width: 0; }
.lrow:hover { background: var(--panel-2); }
.lrow .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lrow .time { width: 46px; color: var(--ink-3); font-family: var(--mono); font-size: 12px; flex: none; }
.lrow .acts { margin-left: auto; display: flex; gap: 4px; align-items: center; flex: none; }
.lrow button.more { border: 0; background: none; color: var(--ink-3); cursor: pointer; border-radius: 6px; padding: 2px 8px; letter-spacing: .1em; }
.lrow button.more:hover { color: var(--ink); background: var(--panel-2); }

/* controls */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; font-weight: 550; font-size: 13px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ink-3); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line-2)); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
input[type=text], input[type=number], input[type=password], input[type=search], select, textarea {
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; padding: 6px 9px; min-width: 0; }
input[type=number] { width: 84px; font-family: var(--mono); font-size: 13px; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-2); font-weight: 550; }
label.field small { font-weight: 400; color: var(--ink-3); }
label.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; cursor: pointer; }
label.check input { margin-top: 3px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 5px 11px; cursor: pointer; font-weight: 550; font-size: 12.5px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button.on { background: var(--accent-soft); color: var(--accent); }

/* tables */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--ink-3); padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--panel-2); position: sticky; top: 0; z-index: 1; white-space: nowrap; }
th.num { text-align: right; }
th[data-sort] { cursor: pointer; }
td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:hover td { background: var(--panel-2); }
.tablewrap { overflow: auto; max-height: 68vh; border-radius: 0 0 var(--r) var(--r); }
.tree-name { display: flex; align-items: flex-start; gap: 6px; }
.tree-toggle { width: 18px; height: 18px; border: 0; background: none; cursor: pointer; color: var(--ink-3); padding: 0; flex: none; display: grid; place-items: center; }
.lvl { font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; margin-left: 4px; }

/* status */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.run { background: var(--run-soft); color: var(--run); border-color: transparent; }
.pill.info { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.badge { min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--run); color: #fff; font-size: 11px; font-weight: 700; text-align: center; font-family: var(--mono); }
.src { font-size: 10.5px; font-weight: 600; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--ink-3); margin-left: 4px; text-transform: lowercase; }
.src.official { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.src.override { color: var(--run); border-color: color-mix(in srgb, var(--run) 40%, transparent); }
.src.internal { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }

/* progress */
.bar { position: relative; height: 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.bar > span { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 999px; transition: width .6s cubic-bezier(.16,1,.3,1); }
.bar.ok > span { background: var(--ok); } .bar.run > span { background: var(--run); } .bar.warn > span { background: var(--warn); }
.prog { display: grid; grid-template-columns: 170px 1fr 64px; align-items: center; gap: 12px; padding: 7px 0; }
.prog .lbl { font-weight: 550; font-size: 13px; }
.prog .lbl small { display: block; font-weight: 400; color: var(--ink-3); font-size: 11.5px; line-height: 1.3; }

/* ledger: the headline numbers, as rows of a statement rather than a wall of cards */
.ledger { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 28px; }
.ledger section { padding: 4px 0 10px; }
.ledger h3 { font-size: 12px; font-weight: 650; color: var(--ink-3); margin: 6px 0 4px; letter-spacing: .02em; }
.ledger dl { margin: 0; }
.ledger .ln { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; border-bottom: 1px dashed var(--line); gap: 10px; }
.ledger .ln dt { color: var(--ink-2); }
.ledger .ln dd { margin: 0; font-family: var(--mono); font-size: 14px; font-weight: 500; }
.ledger .ln.big dd { font-size: 18px; font-weight: 600; }
.ledger .ln.neg dd { color: var(--bad); }

/* pipeline stages */
.stages { display: flex; gap: 0; flex-wrap: wrap; }
.stage { font-size: 11.5px; padding: 3px 9px; border: 1px solid var(--line); color: var(--ink-3); background: var(--panel-2); margin-right: -1px; }
.stage:first-child { border-radius: 5px 0 0 5px; } .stage:last-child { border-radius: 0 5px 5px 0; }
.stage.done { color: var(--ok); background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 25%, var(--line)); }
.stage.now { color: #fff; background: var(--run); border-color: var(--run); position: relative; z-index: 1; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px var(--run-soft); } }
@media (prefers-reduced-motion: reduce) { .stage.now { animation: none; } .bar > span { transition: none; } }

.jobcard { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); box-shadow: var(--shadow); }
.jobcard header { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.jobcard .body { padding: 12px 16px; display: grid; gap: 12px; }
.counters { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px 18px; }
.counters div { display: flex; flex-direction: column; }
.counters b { font-family: var(--mono); font-size: 16px; font-weight: 600; }
.counters span { font-size: 11.5px; color: var(--ink-3); }
.running { border-top: 1px dashed var(--line); padding-top: 10px; display: grid; gap: 8px; }
.runline { display: grid; grid-template-columns: minmax(220px, 1.4fr) 2fr auto; gap: 12px; align-items: center; font-size: 13px; }

/* review */
.qcard { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; background: var(--panel); display: grid; gap: 8px; }
.qcard .stem { font-weight: 550; }
.qcard ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.qcard li { padding: 3px 8px; border-radius: 5px; }
.qcard li.key { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.qcard .why { font-size: 12.5px; color: var(--ink-2); }
.qcard details summary { cursor: pointer; color: var(--ink-3); font-size: 12.5px; }
.cite { font-size: 12px; border-left: 2px solid var(--line-2); padding-left: 8px; color: var(--ink-2); }
.note-md h2, .note-md h3 { font-size: 13.5px; margin: 12px 0 4px; }
.note-md ul { margin: 0; padding-left: 18px; }

/* overlays */
.overlay { position: fixed; inset: 0; background: rgba(10,14,22,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.dialog { background: var(--panel); border-radius: 10px; border: 1px solid var(--line); box-shadow: 0 20px 50px rgba(0,0,0,.25); width: min(560px, 100%); max-height: 90vh; overflow: auto; }
.dialog.wide { width: min(1000px, 100%); }
.dialog header { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.dialog .content { padding: 16px 18px; display: grid; gap: 12px; }
.dialog footer { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
.toast { position: fixed; bottom: 18px; right: 18px; background: var(--ink); color: var(--panel); padding: 10px 14px; border-radius: 8px; z-index: 60; max-width: 440px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.toast.bad { background: var(--bad); color: #fff; }
.empty { padding: 30px 16px; text-align: center; color: var(--ink-3); }
.callout { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 10px 12px; font-size: 13px; }
.callout.warn { border-color: color-mix(in srgb, var(--warn) 35%, var(--line)); background: var(--warn-soft); }
.callout.bad { border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); background: var(--bad-soft); }
.spin { width: 14px; height: 14px; border: 2px solid var(--line-2); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; display: inline-block; vertical-align: -2px; }
@keyframes sp { to { transform: rotate(360deg); } }
.login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.login form { width: min(360px, 100%); display: grid; gap: 12px; }
.diffbars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; align-items: end; height: 70px; }
.diffbars div { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 4px 4px 0 0; position: relative; min-height: 2px; }
.diffbars div span { position: absolute; top: -17px; left: 0; right: 0; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--ink-2); }

  $("#shPaper").onchange = (e) => { sheetsSel.paper = e.target.value; store.set("sheets_sel", sheetsSel); renderPage(); };

    const kinds = [$("#shRef").checked && "refresher", $("#shNotes").checked && "notes"].filter(Boolean);
    if (!kinds.length) return toast("Choose refreshers and/or notes.", true);
    try { await api("/api/sheets/run", { method: "POST", body: { exam_id: sheetsSel.exam, paper_id: sheetsSel.paper, kinds, subtopics: $("#shSubs").checked } });
      toast("Writing the missing sheets…"); pollSheets(); renderPage(); }
    catch (e) { toast(e.message, true); }
  };

function pollSheets() {
  clearTimeout(sheetsTimer);
  sheetsTimer = setTimeout(async () => {
    sheetsTimer = 0;

    try {
      const run = await api("/api/sheets/run");
      const box = $("#shRunBox"); if (box) box.innerHTML = sheetRunHtml(run);
      if (run.running) pollSheets(); else if (run.started_at) { const b = $("#shRun"); if (b && b.disabled) renderPage(); }

    ${(run.errors || []).map((e) => `<div class="small" style="color:var(--bad)">✗ ${esc(e.topic_id.split("/").pop())}: ${esc(e.error)}</div>`).join("")}</div>`;

function readStationForm() {
  const v = state.stationDetail.latest;
  const framework = v.framework.map((f, i) => { const parts = $(`[data-fw="${i}"]`).value.split("|").map((x) => x.trim()).filter(Boolean);
    return { ...f, prompt: parts[0] || f.prompt, follow_ups: parts.slice(1) }; });
  const criteria = v.criteria.map((c, i) => ({ competency: c.competency, expected: $(`[data-cexp="${i}"]`).value.trim(),
    alternatives: $(`[data-calt="${i}"]`).value.split(";").map((x) => x.trim()).filter(Boolean),
    marks: +$(`[data-cmarks="${i}"]`).value, safety_critical: $(`[data-csafe="${i}"]`).checked, prompted_credit: c.prompted_credit,
    source_ref: c.source_ref, flagged: c.flagged ? !!($(`[data-cflag="${i}"]`) && $(`[data-cflag="${i}"]`).checked) : false }));
  return { scenario: $("#stScenario").value.trim(), stages: v.stages, instructions_timed: $("#stTimed").value.trim(),
    instructions_guided: v.instructions_guided, framework, criteria, model_answer: $("#stModel").value.trim(),
    time_limit_s: v.time_limit_s, difficulty: v.difficulty, difficulty_dims: v.difficulty_dims, sources: v.sources, pass_mark: v.pass_mark };
}
function bindStation() {
  const id = state.stationId;
  const act = async (path, body, msg) => { try { await api(path, { method: "POST", body: body || {} }); toast(msg); renderPage(); } catch (e) { toast(e.message, true); } };
  $("#stSave").onclick = () => act(`/api/stations-studio/stations/${id}/versions`, { content: readStationForm() }, "Saved as a new version (needs approval).");
  $("#stApprove").onclick = () => { const note = prompt("Approval note (optional): what you checked"); if (note === null) return;
    act(`/api/stations-studio/stations/${id}/approve`, { note }, "Approved."); };
  $("#stPublish").onclick = () => confirm("Publish the latest approved version to learners?") && act(`/api/stations-studio/stations/${id}/publish`, {}, "Published.");
  $("#stSamples").onclick = () => act(`/api/stations-studio/stations/${id}/samples`, {}, "Sample answers written. Mark them below.");
  $("#stCalibrate").onclick = async () => { $("#stCalibrate").disabled = true; $("#stCalibrate").textContent = "Calibrating…";
    try { const r = await api(`/api/stations-studio/stations/${id}/calibrate`, { method: "POST", body: {} });
      toast(r.passed ? "Calibration passed." : "Calibration did not pass.", !r.passed); } catch (e) { toast(e.message, true); } renderPage(); };
  document.querySelectorAll("[data-savegold]").forEach((b) => (b.onclick = () => {
    const gid = b.dataset.savegold; const marks = {};
    document.querySelectorAll(`[data-gold="${gid}"]`).forEach((i) => { marks[i.dataset.crit] = i.value === "" ? null : +i.value; });
    act(`/api/stations-studio/gold/${gid}/marks`, { marks }, "Marks saved.");
  }));
}

async function renderPage() {
  const el = $("#page"); if (!el) return;
  setPath(); renderSide();
  const sc = $("#scroller"); if (sc) sc.scrollTop = 0;
  try {
    if (state.route === "overview") el.innerHTML = await overviewView();
    else if (state.route === "tos") { await ensureDocs(); await loadTree(); el.innerHTML = tosView(); bindTos(); }
    else if (state.route === "new") { await ensureDocs(); el.innerHTML = await newJobView(); bindNewJob(); }
    else if (state.route === "monitor") { el.innerHTML = monitorShell(); await loadJobsAll(); renderMonitorLive(); renderJobsTable(); }
    else if (state.route === "topics") { await ensureDocs(); await loadTree(); el.innerHTML = topicsView(); bindTopics(); }
    else if (state.route === "sheets") { el.innerHTML = await sheetsView(); bindSheets(); }
    else if (state.route === "stations") { el.innerHTML = await stationsView(); bindStations(); }
    else if (state.route === "station") { el.innerHTML = await stationView(); bindStation(); }
    else if (state.route === "review") { await ensureDocs(); el.innerHTML = reviewShell(); await loadReview(); }
    else if (state.route === "failures") el.innerHTML = await failuresView();
    else if (state.route === "settings") el.innerHTML = await settingsView();
    else go("overview");
  } catch (e) { el.innerHTML = `<div class="callout bad">${esc(e.message)}</div>`; }
}
async function ensureDocs(force = false) {
  if (!state.docs.length || force) state.docs = await api("/api/documents");
  if (!state.docs.find((d) => d.id === state.docId)) state.docId = (state.docs.find((d) => d.parse_status === "parsed") || state.docs[0] || {}).id ?? null;
}
const docSelect = (id = "docSel") => `<select id="${id}" aria-label="TOS document">${state.docs.map((d) =>

function treeRows() {
  const t = state.tree; const nodes = t.nodes; const byParent = {};
  nodes.forEach((n) => (byParent[n.parent_id] = byParent[n.parent_id] || []).push(n));
  const q = state.treeFilter.trim().toLowerCase(); const keep = new Set();

    out.push(`<tr data-id="${n.id}"><td><div class="tree-name" style="padding-left:${depth * 16}px">
      ${kids.length ? `<button class="tree-toggle" data-tog="${n.id}" aria-label="${open ? "Collapse" : "Expand"} ${esc(n.name)}" aria-expanded="${open}">${open ? "▾" : "▸"}</button>` : '<span style="width:18px"></span>'}
      <span>${n.ambiguous ? `<span title="${esc(n.ambiguity_note || "")}" style="color:var(--warn)">⚠ </span>` : ""}${esc(n.name)}<span class="lvl">${n.level}</span>
      ${n.detail ? `<div class="small muted" style="max-width:520px">${esc(n.detail)}</div>` : ""}
      ${n.count_note ? `<div class="small muted">${esc(n.count_note)}</div>` : ""}</span></div></td>
      <td class="num">${n.official_count ?? '<span class="muted">—</span>'}</td>
      <td class="num">${fmt(n.planned)}${n.planned_source !== "rollup" ? `<span class="src ${n.planned_source}" title="${esc(n.planned_note || "")}">${n.planned_source}</span>` : ""}</td>
      <td class="num">${fmt(n.generated)}</td><td class="num">${fmt(n.validated)}</td><td class="num">${fmt(n.inserted)}</td><td class="num">${fmt(n.rejected + n.duplicate)}</td>
      <td class="num">${n.notes_planned ? `${n.notes_done}/${n.notes_planned}` : "—"}</td>
      <td>${n.status ? pill(n.status) : ""}${n.difficulty_flag ? `<div class="small" style="color:var(--warn)">${esc(n.difficulty_flag)}</div>` : ""}</td>
      <td>${n.page_no ? `<button class="btn sm ghost" data-page="${n.page_no}">p.${n.page_no}</button>` : ""}</td>

    if (open) kids.forEach((k) => walk(k, depth + 1));

}

  document.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { r.tab = b.dataset.tab; r.offset = 0; renderPage(); }));
  $("#rs") && ($("#rs").onchange = (e) => { r.status = e.target.value; r.offset = 0; renderPage(); });
  $("#rr") && ($("#rr").onchange = (e) => { r.review = e.target.value; r.offset = 0; renderPage(); });
  $("#ns") && ($("#ns").onchange = (e) => { r.nstatus = e.target.value; r.offset = 0; renderPage(); });
  $("#rj").onchange = (e) => { r.job_id = e.target.value.trim(); r.offset = 0; renderPage(); };
  $("#clearNode") && ($("#clearNode").onclick = () => { r.node_id = null; renderPage(); });
  $("#approveAll") && ($("#approveAll").onclick = async () => { if (!confirm("Publish every inserted, unflagged question in this selection to students?")) return;
    const res = await api("/api/items/approve_all", { method: "POST", body: { node_id: r.node_id || null, job_id: r.job_id || null } }); toast(`${res.approved} published.`); renderPage(); });
  const qs = new URLSearchParams({ limit: 30, offset: r.offset }); if (r.node_id) qs.set("node_id", r.node_id); if (r.job_id) qs.set("job_id", r.job_id);
  if (r.tab === "items") { if (r.status) qs.set("status", r.status); if (r.review) qs.set("review", r.review);
    const d = await api("/api/items?" + qs); el.innerHTML = d.items.length ? `<div class="stack">${d.items.map(itemCard).join("")}</div>${pager(d.total)}` : `<div class="panel empty">No questions match.</div>`; }
  else { if (r.nstatus) qs.set("status", r.nstatus);
    const d = await api("/api/notes?" + qs); el.innerHTML = d.notes.length ? `<div class="stack">${d.notes.map(noteCard).join("")}</div>${pager(d.total)}` : `<div class="panel empty">No notes match.</div>`; }
  el.onclick = async (e) => {
    const b = e.target.closest("[data-rev]"); if (b) { const [kind, id, st] = b.dataset.rev.split(":");
      try { await api(`/api/${kind}/${id}/review`, { method: "POST", body: { state: st } }); toast(st === "approved" ? "Approved." : st === "flagged" ? "Flagged and held back." : "Cleared."); loadReview(); } catch (err) { toast(err.message, true); } return; }
    const pg = e.target.closest("[data-off]"); if (pg) { r.offset = +pg.dataset.off; loadReview(); }
  };
}
const pager = (total) => { const r = state.review; return `<div class="row" style="margin-top:12px"><span class="small muted">${r.offset + 1}–${Math.min(total, r.offset + 30)} of ${fmt(total)}</span><span class="grow"></span>
  <button class="btn sm" data-off="${Math.max(0, r.offset - 30)}" ${r.offset ? "" : "disabled"}>Previous</button><button class="btn sm" data-off="${r.offset + 30}" ${r.offset + 30 < total ? "" : "disabled"}>Next</button></div>`; };
function itemCard(i) {
  const p = i.payload || {}; const opts = p.options || {}; const cite = (p.citations || [])[0];
  return `<article class="qcard"><div class="row small">${pill(i.status)}${i.review_state !== "none" ? pill(i.review_state) : ""}${i.mcq_id ? `<span class="muted">MCQ #${i.mcq_id} · ${esc(i.mcq_status || "deleted")}</span>` : ""}
      <span class="muted">difficulty ${i.difficulty ?? "—"}</span><span class="grow"></span><span class="muted mono">${esc(i.job_id)}</span></div>
    <div class="small muted">${esc((i.path || "").split(" > ").slice(-3).join(" › "))}${i.subtopic ? ` › <b>${esc(i.subtopic)}</b>` : ""}</div>
    ${i.reason ? `<div class="callout ${i.status === "rejected" ? "bad" : "warn"} small"><b>${i.status === "duplicate" ? "Duplicate" : "Rejected"}:</b> ${esc(i.reason)}</div>` : ""}
    <div class="stem">${esc(p.question_text)}</div>
    <ol>${Object.keys(opts).sort().map((k) => `<li class="${k === p.key ? "key" : ""}"><b>${k}.</b> ${esc(opts[k])}</li>`).join("")}</ol>
    ${p.explanation ? `<div class="why"><b>Why ${esc(p.key)}:</b> ${esc(p.explanation)}</div>` : ""}
    ${p.distractor_rationales && Object.keys(p.distractor_rationales).length ? `<details><summary>Distractor rationales</summary><ul class="why">${Object.entries(p.distractor_rationales).map(([k, v]) => `<li><b>${esc(k)}.</b> ${esc(v)}</li>`).join("")}</ul></details>` : ""}
    ${p.learning_objective ? `<div class="small"><b>Objective:</b> ${esc(p.learning_objective)}</div>` : ""}
    ${cite ? `<div class="cite">${cite.supported ? "✓ supports the key" : "✗ does not support the key"} · ${esc(cite.book_title || "")}, p.${esc(cite.page_number ?? "")}<div class="muted">${esc((cite.excerpt || "").slice(0, 260))}…</div></div>` : `<div class="cite muted">No source passage cited.</div>`}
    ${i.status === "inserted" ? `<div class="row"><button class="btn sm ${i.review_state === "approved" ? "" : "primary"}" data-rev="items:${i.id}:approved" ${i.review_state === "approved" ? "disabled" : ""}>Approve & publish</button>
      <button class="btn sm" data-rev="items:${i.id}:flagged" ${i.review_state === "flagged" ? "disabled" : ""}>Flag</button>${i.review_state !== "none" ? `<button class="btn sm ghost" data-rev="items:${i.id}:none">Clear</button>` : ""}</div>` : ""}
  </article>`;
}
function md(text) {
  return (text || "").split("\n").map((l) => { const t = esc(l);
    if (/^#{1,3}\s/.test(l)) return `<h3>${t.replace(/^#+\s/, "")}</h3>`;
    if (/^\s*[-*]\s/.test(l)) return `<li>${t.replace(/^\s*[-*]\s/, "").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")}</li>`;
    return t ? `<p style="margin:4px 0">${t}</p>` : ""; }).join("").replace(/(<li>.*?<\/li>)+/g, (m) => `<ul>${m}</ul>`);
}
function noteCard(n) {
  return `<article class="qcard"><div class="row small">${pill(n.status === "done" ? "done" : "failed", n.status === "done" ? "written" : "failed")}${n.review_state !== "none" ? pill(n.review_state) : ""}<span class="grow"></span><span class="muted mono">${esc(n.job_id || "")}</span></div>
    <div class="small muted">${esc((n.path || "").split(" > ").slice(-3).join(" › "))}</div>
    ${n.reason ? `<div class="callout bad small">${esc(n.reason)}</div>` : ""}
    ${n.plan ? `<div class="small muted" style="margin:6px 0">${n.plan.intent ? `<div><b>Planned as:</b> ${esc(n.plan.intent)}</div>` : ""}<div><b>Sections:</b> ${esc((n.plan.sections || []).join(" · "))}</div><div><b>Books:</b> ${esc((n.plan.books || []).join(" · "))}</div></div>` : ""}
    ${n.markdown ? `<details ${n.status === "done" ? "" : "open"}><summary>Note (${(n.citations || []).length} cited pages)</summary><div class="note-md">${md(n.markdown)}</div></details>` : ""}
    ${n.status === "done" ? `<div class="row"><button class="btn sm ${n.review_state === "approved" ? "" : "primary"}" data-rev="notes:${n.id}:approved" ${n.review_state === "approved" ? "disabled" : ""}>Approve</button><button class="btn sm" data-rev="notes:${n.id}:flagged">Flag</button></div>` : ""}</article>`;
}

/* ── failures & settings ──────────────────────────────────────────────────────── */
async function failuresView() {
  const f = await api("/api/failures");
  return `<div class="head"><div><h1>Failures and diagnostics</h1><p class="sub">Failed batches with every attempt's error, why questions were rejected, failed notes and TOS pages that could not be read.</p></div></div>
  <div class="cols"><div class="panel"><div class="panel-pad"><h2>Why questions were rejected</h2></div><table><thead><tr><th>Outcome</th><th>Reason</th><th class="num">Count</th></tr></thead><tbody>${f.rejection_reasons.map((r) => `<tr><td>${pill(r.status)}</td><td>${esc(r.reason)}</td><td class="num">${fmt(r.count)}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">None yet.</td></tr>`}</tbody></table></div>
    <div class="panel"><div class="panel-pad"><h2>Errors by kind</h2><p class="small muted" style="margin:0">Transient errors are retried with back-off; permanent ones fail the batch at once.</p></div><table><thead><tr><th>Kind</th><th>Message</th><th class="num">Count</th></tr></thead><tbody>${f.error_kinds.map((r) => `<tr><td>${esc(r.kind)}</td><td class="small">${esc(r.message)}</td><td class="num">${fmt(r.count)}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">None.</td></tr>`}</tbody></table></div></div>
  <div class="panel" style="margin-top:16px"><div class="panel-pad"><h2>Failed batches</h2></div><div class="tablewrap" style="max-height:50vh"><table><thead><tr><th>Batch</th><th>Kind</th><th>Topic</th><th class="num">Tries</th><th>Last error</th><th></th></tr></thead><tbody>
    ${f.failed_batches.map((b) => `<tr><td class="mono">${b.id}</td><td>${b.kind}</td><td>${esc((b.path || "").split(" > ").slice(-2).join(" › "))}</td><td class="num">${b.attempts}</td><td class="small">${esc((b.errors.at(-1) || {}).message || "")}</td><td><button class="btn sm" onclick="state.wizard={document_id:null,scope_node_id:${b.node_id}};location.hash='new'" title="Preview a new job for just this topic">Run topic…</button></td></tr>`).join("") || `<tr><td colspan="6" class="empty">No failed batches.</td></tr>`}</tbody></table></div></div>
  ${f.failed_notes.length ? `<div class="panel" style="margin-top:16px"><div class="panel-pad"><h2>Notes that could not be written</h2></div><table><tbody>${f.failed_notes.map((n) => `<tr><td>${esc(n.path)}</td><td class="small">${esc(n.reason)}</td></tr>`).join("")}</tbody></table></div>` : ""}
  ${f.failed_pages.length ? `<div class="panel" style="margin-top:16px"><div class="panel-pad"><h2>TOS pages not read</h2></div><table><tbody>${f.failed_pages.map((p) => `<tr><td>document ${p.document_id}, page ${p.page_no}</td><td class="small">${esc(p.error)}</td></tr>`).join("")}</tbody></table></div>` : ""}`;
}
async function settingsView() {
  const [s, a] = await Promise.all([api("/api/settings"), api("/api/audit?limit=150")]);
  const ok = (b) => (b ? pill("done", "configured") : pill("failed", "not configured"));
  return `<div class="head"><div><h1>Settings and audit</h1><p class="sub">Providers come from the root .env and are used server-side only; no key is sent to this page. Change them there and restart the Studio.</p></div></div>
  <div class="cols"><div class="panel panel-pad"><h2>Providers</h2><dl class="ledger" style="display:block">
      <div class="ln"><dt>Question generation</dt><dd class="small">${esc(s.generation.model)} ${ok(s.generation.configured)}</dd></div>
      <div class="ln"><dt>Revision notes</dt><dd class="small">${esc(s.notes.model)} ${ok(s.notes.configured)}</dd></div>
      <div class="ln"><dt>TOS page reader</dt><dd class="small">${esc(s.tos_reader.model)} (+${s.tos_reader.fallbacks.length} fallbacks) ${ok(s.tos_reader.configured)}</dd></div>
      <div class="ln"><dt>Workers</dt><dd>${s.workers}</dd></div>
      <div class="ln"><dt>Interrupted after</dt><dd>${s.stale_after_s}s without a heartbeat</dd></div>
      <div class="ln"><dt>Prices (USD / 1M tokens)</dt><dd class="small">${s.prices.input_per_m ?? "—"} in · ${s.prices.output_per_m ?? "—"} out</dd></div></dl></div>
    <div class="panel panel-pad"><h2>Job defaults</h2><pre class="mono small" style="margin:0;white-space:pre-wrap">${esc(JSON.stringify(s.defaults, null, 2))}</pre></div></div>
  <div class="panel" style="margin-top:16px"><div class="panel-pad"><h2>Audit log</h2><p class="small muted" style="margin:0">Targets, corrections, jobs, pauses, cancellations, retries, approvals and sign-ins.</p></div><div class="tablewrap" style="max-height:50vh"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>On</th><th>Detail</th></tr></thead><tbody>
    ${a.map((x) => `<tr><td class="small">${new Date(x.at + "Z").toLocaleString()}</td><td>${esc(x.actor)}</td><td>${esc(x.action)}</td><td class="small">${esc(x.entity)} ${esc(x.entity_id)}</td><td class="small mono" style="max-width:520px;word-break:break-word">${esc(JSON.stringify(x.detail))}</td></tr>`).join("")}</tbody></table></div></div>`;
}

/* ── dialog ───────────────────────────────────────────────────────────────────── */
function dialog(title, html, onOk, wide = false, okLabel = "Save") {
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="dialog ${wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><b>${esc(title)}</b><button class="btn sm ghost" data-x aria-label="Close">✕</button></header>
    <div class="content">${html}<div class="small" id="dlgErr" style="color:var(--bad)"></div></div>${onOk ? `<footer><button class="btn" data-x>Cancel</button><button class="btn primary" id="dlgOk">${esc(okLabel)}</button></footer>` : ""}</div>`;
  document.body.appendChild(o);
  const close = () => { o.remove(); document.removeEventListener("keydown", esc_); };
  const esc_ = (e) => e.key === "Escape" && close(); document.addEventListener("keydown", esc_);
  o.addEventListener("click", (e) => { if (e.target === o || e.target.closest("[data-x]")) close(); });
  if (onOk) $("#dlgOk", o).onclick = async () => { const b = $("#dlgOk", o); b.disabled = true; try { await onOk(); close(); } catch (e) { $("#dlgErr", o).textContent = e.message; b.disabled = false; } };
  const first = o.querySelector("input,button"); first && first.focus();
}

const savedTheme = store.get("theme", ""); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
boot();
</script>
</body>
